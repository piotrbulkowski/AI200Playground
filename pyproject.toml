[project]
name = "ai200-playground"
version = "0.1.0"
description = "Azure AI Knowledge Hub — AI-200 hands-on lab"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "azure-storage-blob>=12.23",
    "azure-identity>=1.19",
    "aiohttp>=3.10",
    "asyncpg>=0.30",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]  # FastAPI's Depends()-as-default is the idiomatic pattern, not a real bug

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
    "integration: hits real Azure Storage / Postgres — run explicitly with `-m integration`",
]

[tool.uv]
package = false
