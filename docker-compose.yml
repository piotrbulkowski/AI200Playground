services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai200}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai200}
      POSTGRES_DB: ${POSTGRES_DB:-ai200_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai200}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Secondary path for Phase 1 — DefaultAzureCredential needs the host's az login token
  # cache mounted in to reach real Blob Storage from inside the container, which is finicky
  # on Windows. Prefer `uv run fastapi dev src/api/main.py` on host until Phase 7 properly
  # containerizes deployment.
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # volumes:
    #   - ${HOME}/.azure:/root/.azure:ro   # uncomment to let DefaultAzureCredential fall back to AzureCliCredential

  # worker: — added in Phase 4
  # redis:  — added in Phase 6

volumes:
  postgres-data:
